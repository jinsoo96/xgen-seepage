[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xgen-seepage"
version = "0.1.0"
description = "Offline-installable XGEN connector for Excel/CSV — live in-workbook editing (formulas included) via xlwings, plus CSV read/write. No task pane, no internet required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kim Jinsoo", email = "wlstn010203@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "llm",
    "claude",
    "anthropic",
    "tool-use",
    "agent",
    "excel",
    "xlsx",
    "csv",
    "xlwings",
    "spreadsheet",
    "office-automation",
    "offline",
    "xgen",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
]

dependencies = [
    "chardet>=5.0",
    # mcp 2.x는 Server.list_tools/call_tool 데코레이터와 Tool(inputSchema=)를
    # 제거해 mcp_server.py가 import 단계에서 죽는다(document-adapter와 동일 이슈).
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
# 라이브(열려 있는 통합문서) 편집에만 필요. csv_adapter만 쓸 거면 불필요.
live = ["xlwings>=0.31"]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
xgen-seepage-mcp = "xgen_seepage.mcp_server:main_sync"

[project.urls]
Homepage = "https://github.com/jinsoo96/xgen-seepage"
Repository = "https://github.com/jinsoo96/xgen-seepage"
Issues = "https://github.com/jinsoo96/xgen-seepage/issues"
Changelog = "https://github.com/jinsoo96/xgen-seepage/releases"

[tool.setuptools.packages.find]
include = ["xgen_seepage*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["xgen_seepage"]
