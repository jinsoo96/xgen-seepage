<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>xgen-seepage</title>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <!-- office.js에 의존하지 않는다. 이 패널은 XGEN 연결(로그인 → /workflows →
       /chat/stream)에만 의존하는 순수 웹 UI다. 셀 편집은 이 페이지가 아니라
       커넥터의 WS 브릿지(tools → live_adapter/libreoffice_adapter)가 하므로
       Office JavaScript API를 쓸 일이 없다. Excel 태스크팬으로 띄우든, 그냥
       브라우저로 열든, XGEN에만 붙어 있으면 동작한다. -->
  <div id="status" class="status">XGEN 연결 확인 중...</div>
  <div id="serverinfo" class="serverinfo"></div>
  <div class="agentbar">
    <label for="agent">에이전트</label>
    <select id="agent" disabled><option value="">불러오는 중...</option></select>
    <button id="reload" type="button" title="목록 새로고침" disabled>↻</button>
  </div>
  <div class="agentbar">
    <label for="provider">모델</label>
    <select id="provider" disabled><option value="">서버 기본값</option></select>
  </div>
  <div id="messages" class="messages"></div>
  <form id="composer" class="composer">
    <input id="input" type="text" placeholder="에이전트에게 메시지..." autocomplete="off" disabled />
    <button id="send" type="submit" disabled>전송</button>
  </form>
  <script src="taskpane.js"></script>
</body>
</html>
